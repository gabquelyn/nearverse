# Item types. Every entry is one NEP-245 token id in the single game contract.
# Prices are in cents: 100 cents = 1 coin.
# tier: 1 common, 2 uncommon, 3 rare, 4 legendary. Rarer materials have fewer spots, smaller loads and slower regrowth.
items:
  - { id: wood,      name: Wood,        base_price: 800,   tier: 1, color: "#a9713d" }
  - { id: iron,      name: Iron,        base_price: 2000,  tier: 2, color: "#6f8199" }
  - { id: slate,     name: Slate,       base_price: 1400,  tier: 2, color: "#6a6a80" }
  - { id: clay,      name: Clay,        base_price: 1000,  tier: 1, color: "#b9583a" }
  - { id: stone,     name: Stone,       base_price: 600,   tier: 1, color: "#8d8d86" }
  - { id: sand,      name: Sand,        base_price: 500,   tier: 1, color: "#d9bd7c" }
  - { id: reed,      name: Reed,        base_price: 700,   tier: 1, color: "#8ea04a" }
  - { id: coal,      name: Coal,        base_price: 900,   tier: 1, color: "#3c3a3f" }
  - { id: copper,    name: Copper,      base_price: 2400,  tier: 2, color: "#c0763f" }
  - { id: limestone, name: Limestone,   base_price: 1600,  tier: 2, color: "#cfc9b2" }
  - { id: hardwood,  name: Hardwood,    base_price: 3000,  tier: 2, color: "#6e4326" }
  - { id: salt,      name: Salt,        base_price: 1800,  tier: 2, color: "#e7e3da" }
  - { id: resin,     name: Resin,       base_price: 2600,  tier: 2, color: "#d58f2a" }
  - { id: wool,      name: Wool,        base_price: 2200,  tier: 2, color: "#d8d2e0" }
  - { id: tin,       name: Tin Ore,     base_price: 4500,  tier: 3, color: "#9db0b5" }
  - { id: ice,       name: Ice Crystal, base_price: 5500,  tier: 3, color: "#8fdcf2" }
  - { id: silver,    name: Silver,      base_price: 6000,  tier: 3, color: "#c6ccd6" }
  - { id: obsidian,  name: Obsidian,    base_price: 7000,  tier: 3, color: "#2b2438" }
  - { id: amber,     name: Amber,       base_price: 8000,  tier: 3, color: "#e89a1c" }
  - { id: quartz,    name: Quartz,      base_price: 9000,  tier: 3, color: "#e9cfe6" }
  - { id: gold,      name: Gold,        base_price: 20000, tier: 4, color: "#f5c518" }
