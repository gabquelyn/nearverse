  - { id: lot-orchard,  name: Orchard Gate,   x: -310, z: 150,  price: 300,  needs: { wood: 14, clay: 4 } }
  - { id: lot-crossing, name: Old Crossing,   x: -200, z: -310, price: 350,  needs: { clay: 12, wood: 8 } }
  - { id: lot-mill,     name: Mill Road,      x: 170,  z: 330,  price: 350,  needs: { wood: 16 } }
  - { id: lot-hollow,   name: Fern Hollow,    x: -600, z: 420,  price: 450,  needs: { wood: 18, iron: 4 } }
  - { id: lot-pass,     name: Northern Pass,  x: 70,   z: 500,  price: 500,  needs: { wood: 12, iron: 6 } }
  - { id: lot-lodge,    name: Snow Lodge,     x: -130, z: 810,  price: 600,  needs: { wood: 20, iron: 8 } }
  - { id: lot-summit,   name: Summit Post,    x: 230,  z: 840,  price: 750,  needs: { iron: 12, slate: 10 } }
  - { id: lot-oasis,    name: Oasis Bazaar,   x: -560, z: -500, price: 650,  needs: { clay: 18, wood: 6 } }
  - { id: lot-dunes,    name: Dune Market,    x: -840, z: -130, price: 700,  needs: { clay: 14, slate: 8 } }
  - { id: lot-canyon,   name: Canyon Stop,    x: -260, z: -830, price: 700,  needs: { iron: 8, clay: 16 } }
  - { id: lot-plaza,    name: City Plaza,     x: 650,  z: -120, price: 1200, needs: { slate: 16, iron: 10 } }
  - { id: lot-docks,    name: Harbor Docks,   x: 860,  z: -330, price: 1100, needs: { iron: 16, wood: 10 } }
  - { id: lot-terminal, name: Rail Terminal,  x: 400,  z: -400, price: 950,  needs: { slate: 10, iron: 8, wood: 6 } }

player:
  start_coins: 15000
  gather_cooldown_ms: 3000
  travel_ms: 8000            # minimum time between trading with two different merchants
  max_trade_qty: 50

quests:
  period_ticks: 12
  gathers_required: 3
  reward_qty: 4

blueprints:
  - id: shed
    name: Shed
    sections:
      - { needs: { wood: 6 }, labor: 800 }
      - { needs: { wood: 4, clay: 4 }, labor: 1000 }
  - id: house
    name: House
    sections:
      - { needs: { clay: 8, wood: 4 }, labor: 1500 }
      - { needs: { wood: 8, iron: 2 }, labor: 1800 }
      - { needs: { slate: 8, iron: 2 }, labor: 2200 }
  - id: tower
    name: Signal tower
    sections:
      - { needs: { slate: 8, clay: 6 }, labor: 2500 }
      - { needs: { iron: 8, wood: 6 }, labor: 3000 }
      - { needs: { iron: 10, slate: 6 }, labor: 3500 }
      - { needs: { iron: 12, slate: 8 }, labor: 4500 }
