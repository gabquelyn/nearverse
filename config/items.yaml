# Item types. Every entry is one NEP-245 token id in the single game contract.
# Prices are in cents: 100 cents = 1 coin.
items:
  - { id: wood,  name: Wood,  base_price: 800 }
  - { id: iron,  name: Iron,  base_price: 2000 }
  - { id: slate, name: Slate, base_price: 1400 }
  - { id: clay,  name: Clay,  base_price: 1000 }

# Hidden resources. Spots are not on the map, so finding them is the game. They are generated from these
# settings by scripts/gen-contract-config.ts. The further out and the richer a spot, the more obstacles guard it.
resources:
  seed: 20261114
  starter_spots: [{ item: wood, x: 95, z: -110 }, { item: clay, x: -120, z: -85 }, { item: iron, x: 60, z: 140 }]
  regions:
    - { name: Forest,     x: -420, z: 300,  spread: 420, count: 16, items: [wood, wood, clay, iron] }
    - { name: Snowfields, x: 30,   z: 770,  spread: 300, count: 12, items: [iron, wood, slate] }
    - { name: Desert,     x: -620, z: -430, spread: 300, count: 12, items: [clay, clay, slate, iron] }
    - { name: City,       x: 630,  z: -230, spread: 260, count: 10, items: [slate, iron, iron] }
    - { name: Wilds,      x: 120,  z: -760, spread: 240, count: 8,  items: [iron, slate, clay, wood] }

# Credits are bought with NEAR, which the game keeps. Fuel, repairs, vehicles and stall locations cost credits.
credits:
  credits_per_near: 1000
  start_credits: 500
  start_fuel: 60
  # Upkeep is paid in coins, so a sold load pays for the next trip. Prices are in hundredths of a coin:
  # a Pickup's 100-unit tank costs 15.00 coins to fill and its 100 health costs 10.00 to repair.
  # With too few coins, the same amount is charged in credits instead, rounded up.
  coins_per_fuel: 15
  coins_per_repair: 10
  # A rich spot pays this many hundredths of a coin per richness point, each time you load there.
  rich_bonus_per_point: 100
  meters_per_fuel: 40        # how far one unit of fuel takes the starter truck

# Every vehicle's price, in credits, comes from this formula, and the contract computes it itself:
#   price = capacity x price_per_capacity + endurance x price_per_endurance
#         + percent of fuel saved x price_per_fuel_percent + flair x price_per_flair + size x price_per_size
# Burning more fuel than the starter (fuel_bps above 10000) lowers the price.
vehicle_pricing:
  price_per_capacity: 30
  price_per_endurance: 4
  price_per_fuel_percent: 8
  price_per_flair: 300
  price_per_size: 80

# capacity: truck bed units. endurance: health. fuel_bps: 10000 = normal fuel use. tank: fuel it holds.
# flair: looks, 0 to 3. size: 1 to 5, a bigger body is a bigger target. The first vehicle is free.
vehicles:
  - { id: pickup,   name: Pickup,      blurb: The truck everyone starts with.,               capacity: 24, endurance: 100, fuel_bps: 10000, tank: 100, flair: 0, size: 2, paint: "#c8372b" }
  - { id: scout,    name: Scout,       blurb: Small and thrifty. Sips fuel but carries little., capacity: 16, endurance: 90,  fuel_bps: 5000, tank: 70,  flair: 1, size: 1, paint: "#e0a437" }
  - { id: hauler,   name: Hauler,      blurb: A long bed for big loads. Thirsty.,            capacity: 42, endurance: 130, fuel_bps: 14000, tank: 140, flair: 0, size: 4, paint: "#2f6db0" }
  - { id: bulwark,  name: Bulwark,     blurb: Armored for hazard routes.,                    capacity: 30, endurance: 240, fuel_bps: 12000, tank: 130, flair: 1, size: 4, paint: "#4a6b58" }
  - { id: rally,    name: Rally,       blurb: Light bar, racing paint and good fuel use.,    capacity: 26, endurance: 120, fuel_bps: 7000, tank: 110,  flair: 3, size: 2, paint: "#d9368b" }
  - { id: titan,    name: Titan,       blurb: Carries the most and takes the most.,          capacity: 60, endurance: 300, fuel_bps: 15000, tank: 180, flair: 2, size: 5, paint: "#23272f" }

# Locations for stalls. Buy one with credits, then bring the materials it needs, bought or found. Either counts.
stall_lots:
