# THE pricing rules. Contract, simulation and tooltips are all generated from this file.
#
#   price = base * (target_stock / current_stock) ^ k, clamped to floor..ceiling
#   merchant pays you  = price * (1 + blueprint_premium) * (1 - spread)
#   merchant charges you = price * (1 + spread)
#
# k is written in quarters so the contract can compute it exactly with integer
# square roots. Allowed k_quarters: 1 (0.25), 2 (0.5), 3 (0.75), 4 (1), 6 (1.5), 8 (2).
# Percentages are basis points: 100 bps = 1%.

time:
  tick_ms: 600000           # one market hour passes every 10 real minutes
  max_catchup_ticks: 168    # one call catches up at most a market week

price:
  floor_bps: 3500           # never under 35% of base
  ceiling_bps: 30000        # never over 300% of base

merchants:
  - id: hoarder
    x: -540
    z: 340
    name: Hoarder
    personality: Holds large stock, so prices move slowly
    k_quarters: 2           # k = 0.5
    spread_bps: 1000
    premium_bps: 0
    start_cash: 900000
    cash_cap: 1200000
    stipend: 1500           # coins from townsfolk each market hour, up to cash_cap
    reversion_bps: 80       # stock drifts 0.8% toward target each hour
    targets: { wood: 300, iron: 160, slate: 200, clay: 280, stone: 300, sand: 400, reed: 250, coal: 200, limestone: 120, salt: 110 }
  - id: flipper
    x: 560
    z: -250
    name: Flipper
    personality: Tight spreads, reacts fast to stock changes
    k_quarters: 6           # k = 1.5
    spread_bps: 350
    premium_bps: 0
    start_cash: 300000
    cash_cap: 500000
    stipend: 1200
    reversion_bps: 350
    targets: { wood: 60, iron: 30, slate: 40, clay: 55, copper: 30, coal: 50, tin: 16, silver: 10 }
  - id: foreman
    x: 280
    z: 250
    name: Foreman
    personality: Builds to blueprints and pays extra for what the current one needs
    k_quarters: 4           # k = 1
    spread_bps: 600
    premium_bps: 500        # must stay below spread_bps so buy-back loops lose money
    start_cash: 500000
    cash_cap: 800000
    stipend: 1000
    reversion_bps: 200
    targets: { wood: 100, iron: 70, slate: 80, clay: 90, stone: 120, limestone: 60, hardwood: 40, copper: 40, resin: 30 }
  - id: jeweler
    x: -60
    z: -560
    name: Jeweler
    personality: Deals only in precious things, holds little, and prices jump with every sale
    k_quarters: 6
    spread_bps: 500
    premium_bps: 0
    start_cash: 400000
    cash_cap: 700000
    stipend: 900
    reversion_bps: 150
    targets: { silver: 14, amber: 8, quartz: 8, obsidian: 8, gold: 4, sapphire: 3, ruby: 3, meteorite: 2 }
  - id: outfitter
    x: -200
    z: 620
    name: Outfitter
    personality: Supplies expeditions with goods from the far regions
    k_quarters: 3
    spread_bps: 700
    premium_bps: 0
    start_cash: 350000
    cash_cap: 600000
    stipend: 900
    reversion_bps: 180
    targets: { wool: 40, ice: 12, salt: 40, resin: 30, hardwood: 30, reed: 80, obsidian: 8, coal: 40 }

# A merchant below this share of its starting cash closes completely: no trade and no income, until
# players invest coins that lift it back over the line. Investors share in what it sells from then on.
closure:
  closed_below_bps: 500      # under 5% of starting cash
  investor_cut_bps: 2000     # 20% of each sale to a player goes to investors, split by stake
  max_investors: 10          # per merchant

# Merchants learn. When stock stays outside the band, they change what they stock.
adaptation:
  every_ticks: 24
  band_bps: 800             # react if stock is more than 8% away from target
  step_bps: 500             # change the target by 5%
  target_min_bps: 6000      # stay within 60% of the original target
  target_max_bps: 16000     # and 160% of it

# Foreman's current blueprint rotates through config/items.yaml blueprints.
foreman_blueprint_period_ticks: 36

# One event fires every period, cycling through the list. keep_bps scales every merchant's stock:
# 5500 keeps 55% (a shortage), 15000 makes it 150% (a glut).
events:
  period_ticks: 30
  duration_ticks: 8
  list:
    - { id: iron-shortage, title: Iron shortage, text: A caravan never arrived. Merchants lost iron., item: iron, keep_bps: 5500 }
    - { id: timber-glut, title: Timber glut, text: Storm-felled trees flooded the market., item: wood, keep_bps: 15000 }
    - { id: slate-slide, title: Slate slide, text: The cut collapsed and slate is scarce., item: slate, keep_bps: 6000 }
    - { id: clay-flood, title: River flood, text: The river left clay everywhere., item: clay, keep_bps: 14000 }
    - { id: copper-boom, title: Copper boom, text: A new wire works bought up all the copper., item: copper, keep_bps: 6000 }
    - { id: gold-rush, title: Gold rush, text: Prospectors flooded in with gold., item: gold, keep_bps: 15000 }

# Player-owned stalls price like merchants, from their own stock. The owner sets the spread within these limits.
stalls:
  k_quarters: 4
  target_stock: 40
  default_spread_bps: 800
  min_spread_bps: 200
  max_spread_bps: 2500
  # The city will always buy an empty stall for this share of its material value.
  city_buyback_bps: 5000
  # These lots begin as finished stalls owned by a merchant and for sale in coins, so there is a market on day one.
  merchant_stalls: { lot-brook: foreman, lot-plaza: flipper, lot-hollow: hoarder, lot-vault: jeweler, lot-frost: outfitter }
  seed_price: 60000
  seed_stock: 30
  seed_cash: 40000
