[package]
name = "nearverse"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nearverse game contract: NEP-245 items, merchant market, in-game bank."
repository = "https://github.com/REPLACE_ME/nearverse"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
